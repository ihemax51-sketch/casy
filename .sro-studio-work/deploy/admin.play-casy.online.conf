<VirtualHost *:80>
    ServerName admin.play-casy.online
    DocumentRoot "C:/laragon/www/sro-studio/public"

    SetEnvIf X-Forwarded-Proto https HTTPS=on
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} !=https
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

    <Directory "C:/laragon/www/sro-studio/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/admin-play-casy-online-error.log"
    CustomLog "logs/admin-play-casy-online-access.log" common
</VirtualHost>

<VirtualHost *:443>
    ServerName admin.play-casy.online
    DocumentRoot "C:/laragon/www/sro-studio/public"

    SSLEngine on
    SSLCertificateFile "C:/laragon/etc/ssl/laragon.crt"
    SSLCertificateKeyFile "C:/laragon/etc/ssl/laragon.key"

    SetEnvIf X-Forwarded-Proto https HTTPS=on
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    <Directory "C:/laragon/www/sro-studio/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/admin-play-casy-online-ssl-error.log"
    CustomLog "logs/admin-play-casy-online-ssl-access.log" common
</VirtualHost>
